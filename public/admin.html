<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Diana Arcana</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Karla:wght@400;700&display=swap">
<style>
:root{--night:#16121f;--cloth:#211a2e;--veil:#2e2540;--candle:#d9b46a;--ink:#efe8f5;--mist:#b5aac4;--rose:#c98a9a;--ok:#8fc9a0}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--ink);font:16px/1.5 Karla,system-ui,sans-serif;padding:24px 16px}
main{max-width:860px;margin:0 auto;display:grid;gap:16px}
h1{font:600 34px "Cormorant Garamond",serif;margin:0}
p{margin:0;color:var(--mist)}
form,.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--cloth);color:var(--ink);border:1px solid var(--veil);border-radius:10px;padding:10px 12px;font:16px Karla,sans-serif}
button{border-radius:999px;border:1px solid var(--candle);background:var(--candle);color:var(--night);font-weight:700;padding:9px 18px;cursor:pointer;font-size:15px}
button.sec{background:transparent;color:var(--candle)}
.card{background:var(--cloth);border:1px solid var(--veil);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.card b{font-size:18px}
.est{font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid}
.est.pendiente{color:var(--candle)} .est.activa{color:var(--ok)} .est.inactiva,.est.vencida{color:var(--rose)}
a{color:var(--candle)}
.err{color:var(--rose)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Suscriptoras</h1>
  <form id="login">
    <input type="password" id="clave" placeholder="Clave de administración" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  <p class="err" id="err"></p>
  <section id="panel" hidden>
    <div class="fila" style="margin-bottom:12px">
      <select id="filtro"><option value="">Todas</option><option value="pendiente">Pendientes</option><option value="activa">Activas</option><option value="vencida">Vencidas</option><option value="inactiva">Inactivas</option></select>
      <input id="buscar" placeholder="Buscar nombre, teléfono o referencia">
      <button class="sec" id="recargar" type="button">Actualizar</button>
    </div>
    <div class="card" style="margin-bottom:14px">
      <b>Modo prueba</b>
      <p>Deja tu cuenta libre para probar Arcana sin suscribirte, en cualquier equipo. Primero entra al chat con tu cuenta en este mismo navegador.</p>
      <div class="fila"><button type="button" id="probar">Activar mi cuenta para pruebas</button></div>
    </div>
    <p id="resumen" style="margin-bottom:12px"></p>
    <div id="lista" style="display:grid;gap:10px"></div>
    <h1 style="margin-top:28px">Cuentas de clientas</h1>
    <p id="ctResumen" style="margin:6px 0 12px"></p>
    <input id="ctBuscar" placeholder="Buscar nombre o WhatsApp" style="margin-bottom:10px;width:100%">
    <div id="ctLista" style="display:grid;gap:10px"></div>
    <h1 style="margin-top:28px">Conversaciones</h1>
    <p id="cvResumen" style="margin:6px 0 12px"></p>
    <input id="cvBuscar" placeholder="Buscar clienta o palabra en las conversaciones" style="margin-bottom:10px;width:100%">
    <div id="cvLista" style="display:grid;gap:10px"></div>
    <h1 style="margin-top:28px">Opiniones</h1>
    <p id="opResumen" style="margin:6px 0 12px"></p>
    <div id="opLista" style="display:grid;gap:10px"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let clave = "", datos = [];
try { clave = sessionStorage.getItem("arcana-admin") || ""; } catch {}

async function api(metodo, cuerpo) {
  const r = await fetch("/api/admin", { method: metodo, headers: { "Content-Type": "application/json", "x-admin-clave": clave }, body: cuerpo ? JSON.stringify(cuerpo) : undefined }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {};
  if (!r || !r.ok) throw new Error(j.error || "Sin conexión.");
  return j;
}
const estado = (s) => s.estado === "activa" && s.activa_hasta && new Date(s.activa_hasta) <= new Date() ? "vencida" : s.estado;
const fecha = (x) => x ? new Date(x).toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" }) : "";
const wa = (tel) => { let d = String(tel).replace(/\D/g, ""); if (d.startsWith("0")) d = "593" + d.slice(1); return "https://wa.me/" + d; };

function pintar() {
  const f = $("filtro").value, q = $("buscar").value.trim().toLowerCase();
  const filas = datos.filter((s) => (!f || estado(s) === f) && (!q || [s.nombre, s.telefono, s.email, s.referencia].join(" ").toLowerCase().includes(q)));
  const n = (e) => datos.filter((s) => estado(s) === e).length;
  $("resumen").textContent = `${n("activa")} activas · ${n("pendiente")} pendientes · ${n("vencida")} vencidas`;
  $("lista").replaceChildren(...filas.map((s) => {
    const e = estado(s), ref = String(s.referencia), dia = ref.startsWith("DD-"), sem = ref.startsWith("DS-"), pru = ref.startsWith("DP-"), c = document.createElement("div"); c.className = "card";
    const t = document.createElement("div"); t.className = "fila";
    const b = document.createElement("b"); b.textContent = s.nombre;
    const est = document.createElement("span"); est.className = "est " + e; est.textContent = e + (e === "activa" ? " hasta " + fecha(s.activa_hasta) + (dia || sem ? " " + new Date(s.activa_hasta).toLocaleTimeString("es-EC", { hour: "2-digit", minute: "2-digit" }) : "") : "");
    t.append(b, est);
    const info = document.createElement("p");
    info.textContent = `${pru ? "Pruebas de Diana (sin costo)" : dia ? "Pase 24 horas ($1.99, 4 tiradas)" : sem ? "Semanal ($4.99, 10 tiradas)" : "Mensual antiguo ($4.99)"} · Ref. ${s.referencia} · ${s.telefono} · ${s.email} · pidió el ${fecha(s.creada)}`;
    const acc = document.createElement("div"); acc.className = "fila";
    const act = document.createElement("button"); const periodo = pru ? "1 año" : dia ? "24 horas" : sem ? "7 días" : "30 días"; act.textContent = (e === "activa" ? "Renovar " : "Activar ") + periodo;
    act.onclick = () => accion(s.id, "activar", act);
    acc.append(act);
    if (e === "activa") { const des = document.createElement("button"); des.className = "sec"; des.textContent = "Desactivar"; des.onclick = () => accion(s.id, "desactivar", des); acc.append(des); }
    const w = document.createElement("a"); w.href = wa(s.telefono); w.target = "_blank"; w.rel = "noopener"; w.textContent = "WhatsApp";
    acc.append(w);
    c.append(t, info, acc); return c;
  }));
  if (!filas.length) $("lista").textContent = "No hay suscriptoras con ese filtro.";
}
async function cargar() {
  $("err").textContent = "";
  try { datos = (await api("GET")).suscriptoras || []; $("login").hidden = true; $("panel").hidden = false; pintar(); cargarCuentas(); cargarConversaciones(); cargarOpiniones(); }
  catch (e) { $("err").textContent = e.message; if (/Clave/.test(e.message)) { $("login").hidden = false; $("panel").hidden = true; } }
}
async function cargarOpiniones() {
  try {
    const r = await fetch("/api/admin?ver=opiniones", { headers: { "x-admin-clave": clave } }); const j = await r.json();
    const ops = j.opiniones || [];
    if (j.aviso) { $("opResumen").textContent = j.aviso; return; }
    const prom = ops.length ? (ops.reduce((s, o) => s + o.estrellas, 0) / ops.length).toFixed(1) : "-";
    const dist = [5, 4, 3, 2, 1].map((n) => `${n}★ ${ops.filter((o) => o.estrellas === n).length}`).join(" · ");
    $("opResumen").textContent = ops.length ? `Promedio ${prom} de 5 en ${ops.length} opiniones · ${dist}` : "Todavía no hay opiniones.";
    $("opLista").replaceChildren(...ops.map((o) => {
      const c = document.createElement("div"); c.className = "card";
      const b = document.createElement("b"); b.textContent = "★".repeat(o.estrellas) + "☆".repeat(5 - o.estrellas); b.style.color = "var(--candle)";
      const t = document.createElement("p"); t.style.color = "var(--ink)"; t.textContent = o.comentario || "(sin comentario)";
      const m = document.createElement("p"); m.style.fontSize = "13px"; m.textContent = [fecha(o.creada), o.tirada, o.cartas].filter(Boolean).join(" · ");
      c.append(b, t, m); return c;
    }));
  } catch { $("opResumen").textContent = "No se pudieron cargar las opiniones."; }
}
let cuentas = [];
function pintarCuentas() {
  const q = $("ctBuscar").value.trim().toLowerCase();
  const filas = cuentas.filter((c) => !q || [c.nombre, c.email, c.telefono].join(" ").toLowerCase().includes(q)).slice(0, 100);
  const semana = cuentas.filter((c) => c.ultimo_ingreso && Date.now() - new Date(c.ultimo_ingreso) < 7 * 864e5).length;
  $("ctResumen").textContent = cuentas.length ? `${cuentas.length} cuentas · ${semana} entraron esta semana.` : "Todavía no hay cuentas.";
  $("ctLista").replaceChildren(...filas.map((c) => {
    const d = document.createElement("div"); d.className = "card";
    const b = document.createElement("b"); b.textContent = c.nombre + ((c.recuperar_intentos || 0) >= 10 ? " · 🔒 pausada por PIN equivocados (ponle un PIN nuevo si te lo pide)" : "");
    const dt = c.datos || {}, lec = (dt.lecturas || []).length;
    const info = document.createElement("p");
    info.textContent = `${c.telefono || "-"}${c.email ? " · " + c.email : ""} · ${dt.fecha ? "nació el " + dt.fecha + " en " + dt.ciudad + " · " : ""}${lec} lecturas · creada el ${fecha(c.creada)}${c.ultimo_ingreso ? " · último ingreso " + fecha(c.ultimo_ingreso) : ""}`;
    const acc = document.createElement("div"); acc.className = "fila";
    const cambiar = document.createElement("button"); cambiar.className = "sec"; cambiar.textContent = "Nuevo PIN";
    cambiar.onclick = () => {
      const i = document.createElement("input"); i.placeholder = "PIN de 4 números"; i.inputMode = "numeric"; i.maxLength = 4; i.autocomplete = "off";
      const g = document.createElement("button"); g.textContent = "Guardar";
      g.onclick = async () => { g.disabled = true; try { const j = await api("POST", { accion: "clave", cuentaId: c.id, clave: i.value }); $("err").style.color = "var(--ok)"; $("err").textContent = "✓ " + c.nombre + ": " + j.aviso; acc.replaceChildren(cambiar, w); } catch (e) { $("err").style.color = ""; $("err").textContent = e.message; g.disabled = false; } };
      acc.replaceChildren(i, g, w); i.focus();
    };
    const w = document.createElement("a"); w.href = wa(c.telefono || ""); w.target = "_blank"; w.rel = "noopener"; w.textContent = "WhatsApp";
    const confirmar = (texto, accion, aviso) => {
      const x = document.createElement("button"); x.className = "sec"; x.textContent = texto;
      x.onclick = async () => {
        if (!x.dataset.ok) { x.dataset.ok = 1; x.textContent = "¿Segura? Toca otra vez"; setTimeout(() => { delete x.dataset.ok; x.textContent = texto; }, 4000); return; }
        x.disabled = true;
        try { const j = await api("POST", { accion, cuentaId: c.id }); $("err").style.color = "var(--ok)"; $("err").textContent = "✓ " + c.nombre + ": " + j.aviso; cargarCuentas(); } catch (e) { $("err").style.color = ""; $("err").textContent = e.message; x.disabled = false; }
      };
      return x;
    };
    acc.append(cambiar, confirmar("Borrar sus datos de nacimiento", "borrar_nacimiento"), confirmar("Eliminar cuenta", "eliminar"), w); d.append(b, info, acc); return d;
  }));
}
async function cargarCuentas() {
  try {
    const r = await fetch("/api/admin?ver=cuentas", { headers: { "x-admin-clave": clave } }); const j = await r.json();
    if (j.aviso) { $("ctResumen").textContent = j.aviso; return; }
    cuentas = j.cuentas || []; pintarCuentas();
  } catch { $("ctResumen").textContent = "No se pudieron cargar las cuentas."; }
}
$("ctBuscar").oninput = () => pintarCuentas();
let convs = [];
function pintarConversaciones() {
  const q = $("cvBuscar").value.trim().toLowerCase();
  const filas = convs.filter((c) => !q || (c.cliente || "").toLowerCase().includes(q) || c.mensajes.some((m) => m.t.toLowerCase().includes(q)));
  $("cvResumen").textContent = convs.length ? `${convs.length} conversaciones de los últimos 90 días (se borran solas después).` : "Todavía no hay conversaciones guardadas.";
  $("cvLista").replaceChildren(...filas.map((c) => {
    const d = document.createElement("details"); d.className = "card";
    const s = document.createElement("summary"); s.style.cursor = "pointer";
    const primera = (c.mensajes.find((m) => m.r === "u" && !/^Hola/.test(m.t)) || c.mensajes.find((m) => m.r === "u") || { t: "" }).t;
    s.textContent = `${c.cliente ? c.cliente + " · " : ""}${new Date(c.actualizada).toLocaleString("es-EC", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })} · ${c.mensajes.length} mensajes · ${primera.slice(0, 80)}`;
    d.appendChild(s);
    d.addEventListener("toggle", () => {
      if (!d.open || d.dataset.ok) return; d.dataset.ok = 1;
      for (const m of c.mensajes) {
        const p = document.createElement("p"); p.style.whiteSpace = "pre-wrap"; p.style.margin = "8px 0 0"; p.style.padding = "8px 12px"; p.style.borderRadius = "10px";
        p.style.background = m.r === "u" ? "var(--veil)" : "transparent"; p.style.color = "var(--ink)"; p.style.border = m.r === "a" ? "1px solid var(--veil)" : "0";
        const b = document.createElement("b"); b.textContent = m.r === "u" ? "Clienta: " : "Arcana: "; b.style.fontSize = "13px"; b.style.color = m.r === "u" ? "var(--rose)" : "var(--candle)";
        p.append(b, m.t); d.appendChild(p);
      }
    });
    return d;
  }));
}
async function cargarConversaciones() {
  try {
    const r = await fetch("/api/admin?ver=conversaciones", { headers: { "x-admin-clave": clave } }); const j = await r.json();
    if (j.aviso) { $("cvResumen").textContent = j.aviso; return; }
    convs = j.conversaciones || []; pintarConversaciones();
  } catch { $("cvResumen").textContent = "No se pudieron cargar las conversaciones."; }
}
$("cvBuscar").oninput = () => pintarConversaciones();
async function accion(id, accion, boton) {
  boton.disabled = true;
  try { const j = await api("POST", { id, accion }); await cargar(); if (j.aviso) { $("err").style.color = "var(--ok)"; $("err").textContent = "🎁 " + j.aviso; } } catch (e) { $("err").style.color = ""; $("err").textContent = e.message; boton.disabled = false; }
}
$("login").onsubmit = (e) => { e.preventDefault(); clave = $("clave").value; try { sessionStorage.setItem("arcana-admin", clave); } catch {} cargar(); };
$("probar").onclick = async () => {
  let disp = "", token = ""; try { disp = localStorage.getItem("arcana-dispositivo") || ""; token = localStorage.getItem("arcana-token") || ""; } catch {}
  const b = $("probar"); b.disabled = true;
  try { const j = await api("POST", token ? { accion: "probar", token } : { accion: "probar", dispositivo: disp }); await cargar(); $("err").style.color = "var(--ok)"; $("err").textContent = "✓ " + (j.aviso || "Listo."); }
  catch (e) { $("err").style.color = ""; $("err").textContent = e.message; }
  b.disabled = false;
};
$("filtro").onchange = pintar; $("buscar").oninput = pintar; $("recargar").onclick = cargar;
if (clave) cargar();
</script>
</body>
</html>
